[todo_interpret]
template =
    当前北京时间：{now_iso}
    请解析下面的用户消息，只返回一个 JSON 对象，不要 Markdown。
    intent 只能是 create、list、delete、confirm_delete、cancel_delete、confirm_replace、cancel_replace、chat。
    - create：识别创建一个或多个待办。只返回 items 数组，每个元素包含 title、date_text、time_text、remind_text、target_text、date_semantic、time_semantic、reminder_semantic。
      一条消息中的每件独立事项都必须各生成一个 items 元素，不得合并或遗漏。
      title 只保留事项本身，不包含日期、时间、提前量或“提醒我”等说明。
      date_text、time_text、remind_text 必须原样保留用户的日期、时间、提醒表达，没有则为 null，不得改写或补全。
      target_text 只在用户明确要求提醒另一个人时填写其原始名称，如“提醒李工去铺线”返回“李工”；提醒用户自己或未指定对象时为 null。
      title 不得包含 target_text，例如“提醒李工去工地铺线”的 title 是“去工地铺线”。
      “我”“我自己”“自己”“本人”都表示用户本人，不得作为 target_text。
      date_semantic、time_semantic、reminder_semantic 必须始终返回对象，不能为 null；没有对应表达时使用 kind=none。
      date_semantic.kind 只能是 none、incomplete、today、relative_days、relative_weeks、relative_months、relative_years、month_offset_day、weekday、calendar_date、day_of_month。
      relative_* 使用 value；“本月/下个月N号”使用 month_offset_day，其中 month_offset 本月=0、下个月=1，day 是日号，不得先计算实际月份；weekday 使用 week_offset 和 weekday（周一=1、周日=7）；calendar_date 只用于用户明确说出的年月日，使用 year、month、day，未说年份时 year=null；day_of_month 使用 day。
      “下周下午”“下个月某天”等不能定位具体日期的表达使用 incomplete，并填写 reason；不得猜具体日期。
      time_semantic.kind 只能是 none、incomplete、clock、relative_duration、soon。
      clock 使用 hour、minute、day_period、is_24_hour；day_period 只能是 dawn、morning、noon、afternoon、evening、night 或 null。
      relative_duration 使用 value 和 unit，unit 只能是 minutes 或 hours。“等会儿、待会儿、一会儿、过会儿、稍后”且无钟点时使用 soon。
      reminder_semantic.kind 只能是 none、incomplete、at_event、before_event、previous_day、clock。
      before_event 使用 value 和 unit，unit 只能是 minutes、hours、days；clock 字段规则与 time_semantic.clock 相同。
      必须按原表达提取语义，不要计算最终日期时间，不得返回 event_at、remind_at。
      没有时段词的“十一点半”必须输出 clock(hour=11, minute=30, day_period=null, is_24_hour=false)，不得猜上午或晚上；程序会选择最近的未来11:30或23:30。
      “等会儿三点半”输出 clock(hour=3, minute=30, day_period=null, is_24_hour=false)，由程序选择最近的未来时间。
      已支持且必须继续正确提取的表达包括：
      今天、明天、后天、大后天、N天后、N周后、N个月后、N年后；本周/这周/下周/下下周加星期；本月/下个月加日期；YYYY-MM-DD、YYYY年M月D日、M月D日、N号。
      15:30、15点30、下午三点半、晚上八点、早上八点、中午；半小时后、两小时后；提前N分钟/小时/天、前一天、当天早上八点、到时候、准时、届时。
      示例：“三天后的下午两点需要去工地验收，提前20分钟提醒我”应提取 relative_days(value=3)、clock(hour=2,minute=0,day_period=afternoon)、before_event(value=20,unit=minutes)。
      示例：“下个月4号早上八点验收”应提取 month_offset_day(month_offset=1,day=4)，不得自行换算为某年某月。
    - list：查询待办。返回 range_start、range_end、keyword；range_end 是不包含的结束时间。
    - delete：首次请求删除。返回 range_start、range_end、keyword、todo_id；用户说“删除编号12的待办”时必须是 delete 且 todo_id=12。此步只查候选，不直接删除。
    - confirm_delete：仅当用户在系统已经要求确认后，明确说“确认删除”“确认删除#12”等确认语句时使用；返回 todo_id，未指定编号则为 null。
    - cancel_delete：取消删除。
    - confirm_replace：用户确认用新待办替换同一时间的旧待办。
    - cancel_replace：用户拒绝或取消替换。
    - chat：其他消息，直接在 reply 中给出自然回复。
      chat 不得声称已创建、已记录或已设置待办/提醒；只有 create 才能表示创建请求。
    create 中未使用的普通字段设为 null，但三个 semantic 字段必须是 kind=none 的对象。其他意图未使用的字段设为 null。相对日期只提取语义，以当前北京时间为计算基准；不允许自行猜测日期。
    用户消息：{text}
