[todo_interpret]
template=
    当前北京时间：{now_iso}
    解析用户消息，只返回合法JSON，不要Markdown、解释或额外字段。
    JSON字段名必须严格使用规定拼写，字段名内部不得插入空格；例如必须写“kind”“hour”“minute”，不能写成“k i n d”“h o u r”“m i n u t e”。
    date_semantic、time_semantic、reminder_semantic必须直接返回语义对象，禁止返回JSON Schema，不得出现type、title、properties包装。

    intent仅可为：help/create/list/delete/confirm_delete/cancel_delete/confirm_replace/cancel_replace/chat。

    【help】
    用户询问“你能做什么”“怎么使用”“帮助”“功能说明”等使用help。help不需要解析待办字段，其他字段均为null；不要使用chat代替help。

    【create】
    返回items，每个独立事项一个item，不得合并/遗漏。item字段固定为：
    title,date_text,time_text,remind_text,target_text,date_semantic,time_semantic,reminder_semantic。
    普通字段无对应内容时为null；三个semantic字段始终为对象，不得为null。

    title仅保留事项本身，不含日期、时间、提前量、“提醒我”等说明，也不含target_text。
    如“提醒李工去工地铺线”→title=“去工地铺线”，target_text=“李工”。
    target_text仅在明确要求提醒他人时填写其原始名称；“我/我自己/自己/本人”均指用户本人，target_text=null。

    date_text/time_text/remind_text必须原样提取，不得改写、补全或计算。

    date_semantic.kind∈{none,incomplete,today,relative_days,relative_weeks,relative_months,relative_years,month_offset_day,weekday,calendar_date,day_of_month}：

    * today：今天
    * relative_days/weeks/months/years：N天后/N周后/N个月后/N年后，字段value=N
    * month_offset_day：本月/下个月N号，字段month_offset=0/1,day=N；不得计算实际年月
    * weekday：本周/这周/下周/下下周+星期，字段week_offset(N),weekday(周一=1...周日=7)
    * calendar_date：明确年月日，如YYYY-MM-DD、YYYY年M月D日、M月D日；字段year/month/day，未说年份year=null
    * day_of_month：N号，字段day=N
    * incomplete：无法定位具体日期，如“下周下午”“下个月某天”，并给reason；不得猜测
    * 无明确日期但有具体钟点时必须为none，不得用incomplete；程序会按当前北京时间选择最近的未来时间

    time_semantic.kind∈{none,incomplete,clock,relative_duration,soon}：

    * clock：hour,minute,day_period,is_24_hour；day_period∈{dawn,morning,noon,afternoon,evening,night,null}
    * relative_duration：value + unit，unit∈{minutes,hours}
    * soon：等会儿/待会儿/一会儿/过会儿/稍后，且无具体钟点
    * 无时段词的“十一点半”必须clock(hour=11,minute=30,day_period=null,is_24_hour=false)，不得猜上午/晚上；程序选择最近未来11:30/23:30
    * “等会儿三点半”同理：clock(hour=3,minute=30,day_period=null,is_24_hour=false)

    reminder_semantic.kind∈{none,incomplete,at_event,before_event,previous_day,clock}：

    * none：未表达特殊提醒要求，程序默认任务时间提醒
    * before_event：提前N分钟/小时/天，字段value,unit，unit∈{minutes,hours,days}
    * “提前提醒/提前通知”但未说提前多久→before_event(value=30,unit=minutes)
    * previous_day：前一天
    * at_event：到时候/准时/届时
    * clock：固定提醒时间，字段规则同time_semantic.clock

    只提取语义，不计算最终event_at/remind_at，不返回event_at/remind_at。

    支持：今天、明天、后天、大后天、N天/周/月/年后、本周/这周/下周/下下周+星期、本月/下个月+日期、YYYY-MM-DD、YYYY年M月D日、M月D日、N号、15:30/15：30/15点30、下午两点/下午两点半/下午或晚上或早上+时间、中午、半小时后/两小时后、提前N分钟/小时/天、提前提醒/提前通知、前一天、当天早上八点、到时候/准时/届时。

    例：“三天后的下午两点需要去工地验收，提前20分钟提醒我”
    →date_semantic={kind:relative_days,value:3}
    →time_semantic={kind:clock,hour:2,minute:0,day_period:afternoon,is_24_hour:false}
    →reminder_semantic={kind:before_event,value:20,unit:minutes}

    例：“下个月4号早上八点验收”
    →date_semantic={kind:month_offset_day,month_offset:1,day:4}

    【list】
    返回range_start,range_end,keyword,scope；range_end为不包含的结束时间；其他字段null。
    scope仅可为all/created/assigned：
    all：用户说“我的待办/我的事项/查询事项”等，查询我创建的，或提醒对象是我的待办；
    created：用户明确说“我创建的/我添加的/我设置的待办”，只查询创建人是我的待办；
    assigned：用户明确说“提醒我的/别人给我安排的待办”，只查询提醒对象是我的待办。
    未明确指定范围时scope=all，不得只按提醒对象筛选，以免漏掉我创建后提醒别人的待办。
    用户明确指定“今天/明天/后天/大后天”时，必须按北京时间计算该自然日的范围：
    range_start为当天00:00:00，range_end为次日00:00:00，均使用完整ISO时间；
    例如当前北京时间为2026-09-28时，“明天”必须返回
    range_start=2026-09-29T00:00:00+08:00、range_end=2026-09-30T00:00:00+08:00。
    不得把“明天”解析成null、今天或全部待办。用户未指定日期时才允许范围字段为null，
    程序会自动排除已经过去的待办。

    【delete】
    首次删除请求使用delete，仅查询候选，不直接删除。返回range_start,range_end,keyword,todo_id。
    “删除编号12的待办”→todo_id=12。

    【confirm_delete】
    仅当系统上一轮明确要求确认删除，且用户明确确认时使用。返回todo_id；未指定编号为null。“确认”“好的”等不能脱离上下文直接判定为confirm_delete。

    【cancel_delete】
    用户取消删除。

    【confirm_replace】
    用户确认用新待办替换同一时间旧待办。

    【cancel_replace】
    用户拒绝/取消替换。

    【chat】
    其他消息。返回reply自然回复。不得声称已创建/记录/设置待办；只有create才表示创建请求。即使消息出现日期时间，只要没有明确创建意图也使用chat。

    【通用】
    用户一句话有多个独立事项必须拆成多个items，即使时间相同。无法确定时不得猜测。优先保留原始表达和更具体的时间。模型不计算最终日期时间。
    同一提醒对象同一时间已有其他事项时，系统保留新事项并提示已有事项；模型不得自行声称替换或删除。
    其他未使用字段均为null，只返回规定字段。

    用户消息：{text}

[todo_help]
template=
    🤖 我能帮你做这些事：

    一、创建定时提醒
    • 提醒我今天下午15:30去答辩
    • 下午两点半去开会（未写日期时按最近的未来时间处理）
    • 明天下午2点去工地交底
    • 提前20分钟提醒我；只说“提前提醒”默认提前30分钟
    • 群聊中提醒其他人时，请在消息里真实@对方；提醒会在原群聊中@对方

    二、查询待办
    • 查看今天/明天的待办，已过期事项不会显示
    • 查询“我的待办”时，会显示我创建的事项，以及别人提醒我的事项
    • 查询“我创建的待办”时，会显示我创建的全部事项，包括提醒别人的事项
    • 查询“提醒我的待办”时，只显示提醒对象是我的事项
    • 查询指定时间段或按关键词查询待办，提醒别人的事项会显示创建人

    三、删除待办
    • 删除编号12的待办
    • 只能删除自己创建的待办
    • 系统会先列出待删除事项，请再确认删除

    四、同一时间的提醒
    • 同一个提醒对象在同一时间有多个事项时，新事项会保留，同时列出已有事项和编号
    • 如需清理已有事项，可以使用“删除编号12的待办”

    五、其他
    • 普通问题可以直接询问我
    • 私聊语音中说出“robot”也可以触发处理
    • AI服务账户欠费或余额不足时，会提示充值地址

    群聊请真实@我触发机器人；私聊请在消息中包含“robot”。

[qwen_billing_error]
template=
    ⚠️ AI助手暂时无法处理这条消息
    【原因】千问AI账户可能已欠费或余额不足。
    【处理】请访问以下页面充值或检查账户余额，完成后重新@机器人：
    https://platform.qianwenai.com/home
